services:
  db:
    image: postgres:16-alpine
    container_name: portal_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en el archivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en el archivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build: ./api
    container_name: portal_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
    volumes:
      - ./api:/app
      - /app/node_modules
      - ./db/init.sql:/schema/init.sql:ro

  web:
    build: ./web
    container_name: portal_web
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

  lambda:
    build: ./lambda
    container_name: portal_lambda
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}

volumes:
  db_data:
