services:
  db:
    image: postgres:16-alpine
    container_name: portal_db
    restart: always
    environment:
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_pass
      POSTGRES_DB: portal_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: ./api
    container_name: portal_api
    restart: always
    depends_on:
      - db
    ports:
      - "3000:3000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - /app/node_modules

  web:
    build: ./web
    container_name: portal_web
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  db_data:
